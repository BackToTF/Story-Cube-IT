<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Story Cube IT mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f7ff"/>
      <stop offset="100%" stop-color="#fff7ef"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#01497c"/>
      <stop offset="100%" stop-color="#2a6f97"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d3557" flood-opacity="0.2"/>
    </filter>
    <style>
      .title { font: 700 44px 'Segoe UI', Tahoma, sans-serif; fill: #ffffff; }
      .subtitle { font: 500 20px 'Segoe UI', Tahoma, sans-serif; fill: #d9edff; }
      .h2 { font: 700 28px 'Segoe UI', Tahoma, sans-serif; fill: #0b2545; }
      .label { font: 600 18px 'Segoe UI', Tahoma, sans-serif; fill: #13315c; }
      .body { font: 500 16px 'Segoe UI', Tahoma, sans-serif; fill: #2f4858; }
      .chip { font: 700 15px 'Segoe UI', Tahoma, sans-serif; fill: #ffffff; }
      .small { font: 500 14px 'Segoe UI', Tahoma, sans-serif; fill: #486581; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <rect x="48" y="36" width="1504" height="190" rx="28" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="90" y="108" class="title">Story Cube IT - Inclusion and Diversity</text>
  <text x="90" y="146" class="subtitle">From game to meaningful experience: creativity, listening, inclusion.</text>

  <rect x="90" y="165" width="220" height="40" rx="20" fill="#ff8c42"/>
  <text x="118" y="191" class="chip">Mode: Collaborative</text>
  <rect x="330" y="165" width="180" height="40" rx="20" fill="#2dc653"/>
  <text x="356" y="191" class="chip">Players: 3</text>
  <rect x="530" y="165" width="250" height="40" rx="20" fill="#f4d35e"/>
  <text x="557" y="191" class="chip" style="fill:#3d2c00;">Round Time: 10 minutes</text>

  <rect x="72" y="260" width="1000" height="300" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="104" y="307" class="h2">Mandatory Round Objective (Message-First)</text>
  <rect x="104" y="330" width="936" height="120" rx="16" fill="#e8f7ff"/>
  <text x="130" y="374" class="label">Objective selected by the team:</text>
  <text x="130" y="407" class="body">Make at least one decision that includes a perspective we usually miss in IT projects.</text>
  <text x="130" y="438" class="small">This is a shared intention, not a performance score.</text>

  <text x="104" y="498" class="label">Prompt for the round</text>
  <rect x="104" y="514" width="936" height="30" rx="15" fill="#f2f5f7"/>
  <text x="124" y="534" class="small">How does your idea reduce exclusion risk in a real digital service?</text>

  <rect x="72" y="590" width="1000" height="335" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="104" y="636" class="h2">Rolled Story Cubes</text>

  <rect x="104" y="665" width="300" height="210" rx="18" fill="#eff6ff"/>
  <text x="126" y="705" class="label">AI</text>
  <text x="126" y="736" class="body">Face: Creativity</text>
  <text x="126" y="768" class="small">Introduce one surprising angle.</text>

  <rect x="422" y="665" width="300" height="210" rx="18" fill="#f0fff4"/>
  <text x="444" y="705" class="label">Cloud</text>
  <text x="444" y="736" class="body">Face: Resilience</text>
  <text x="444" y="768" class="small">Handle one failure mode gracefully.</text>

  <rect x="740" y="665" width="300" height="210" rx="18" fill="#fff7ed"/>
  <text x="762" y="705" class="label">People</text>
  <text x="762" y="736" class="body">Face: Accessibility</text>
  <text x="762" y="768" class="small">Make the idea inclusive by design.</text>

  <rect x="1106" y="260" width="422" height="665" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1138" y="307" class="h2">Session Signals (Non-Competitive)</text>

  <rect x="1138" y="332" width="358" height="118" rx="16" fill="#f7fbff"/>
  <text x="1160" y="367" class="label">Inclusion Signal</text>
  <rect x="1160" y="383" width="300" height="12" rx="6" fill="#dbe7f0"/>
  <rect x="1160" y="383" width="240" height="12" rx="6" fill="#2a9d8f"/>
  <text x="1160" y="420" class="small">Shared indicator for reflection, not ranking.</text>

  <rect x="1138" y="468" width="358" height="158" rx="16" fill="#fffaf0"/>
  <text x="1160" y="503" class="label">Debrief Snapshot</text>
  <text x="1160" y="532" class="body">1. New perspective surfaced</text>
  <text x="1160" y="558" class="body">2. Bias recognized and discussed</text>
  <text x="1160" y="584" class="body">3. Action for tomorrow defined</text>

  <rect x="1138" y="644" width="358" height="190" rx="16" fill="#f1f8e9"/>
  <text x="1160" y="679" class="label">KPI Export</text>
  <text x="1160" y="708" class="body">- Active participation rate</text>
  <text x="1160" y="734" class="body">- Distinct ideas generated</text>
  <text x="1160" y="760" class="body">- Inclusion insights captured</text>
  <text x="1160" y="786" class="body">- Transfer actions committed</text>

  <rect x="1138" y="852" width="160" height="46" rx="23" fill="#0b6e4f"/>
  <text x="1172" y="882" class="chip">Export XLSX</text>
  <rect x="1318" y="852" width="178" height="46" rx="23" fill="#386641"/>
  <text x="1357" y="882" class="chip">Export JSON</text>
</svg>
